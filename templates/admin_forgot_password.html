<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicLens - Officer Access Key Recovery</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --slate-900: #0b1120;
      --slate-800: #0f172a;
      --slate-400: #94a3b8;
      --box-border: rgba(255, 255, 255, 0.09);
      --cyan: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      min-height: 100vh;
      background-color: var(--slate-900);
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(2, 132, 199, 0.18), transparent),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }

    .card {
      max-width: 440px;
      width: 100%;
      background: var(--slate-800);
      border: 1px solid var(--box-border);
      border-radius: 16px;
      padding: 34px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .portal-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(2, 132, 199, 0.15);
      border: 1px solid rgba(2, 132, 199, 0.3);
      color: var(--cyan);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 14px;
    }

    .title { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: var(--slate-400); line-height: 1.5; margin-bottom: 22px; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }

    input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.25);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      transition: background 0.2s;
    }

    .btn-submit:hover { background: var(--primary-dark); }
    .btn-submit:disabled { background: #334155; cursor: not-allowed; }

    .status-msg { font-size: 13px; margin-bottom: 16px; padding: 10px; border-radius: 8px; }
    .status-success { background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; }
    .status-error { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; }

    .back-link { display: block; text-align: center; margin-top: 18px; font-size: 13px; color: var(--slate-400); text-decoration: none; }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>

  <div class="card">
    <div class="portal-tag">🏛️ Official Dispatch Security</div>
    <h2 class="title">Reset Officer Access Key</h2>
    <p class="subtitle">Authenticate your record with your Badge ID and registered Date of Birth.</p>

    <div id="statusBox"></div>

    <form id="officerResetForm" onsubmit="event.preventDefault(); handleOfficerReset();">
      <div class="form-group">
        <label>Officer ID / Service Badge</label>
        <input type="text" id="officerIdInput" placeholder="e.g. OFFICER101" required style="text-transform: uppercase;">
      </div>

      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" id="dobInput" required style="color-scheme: dark;">
      </div>

      <div class="form-group">
        <label>New Access Key / Password</label>
        <div style="position: relative;">
          <input type="password" id="newPasswordInput" placeholder="Minimum 6 characters" required style="padding-right: 44px;">
          <span onclick="togglePasswordVisibility(this)" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 16px; user-select: none;">👁️</span>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmitReset">Reset Access Key</button>
    </form>

    <a href="/admin/login" class="back-link">Back to Municipal Sign In</a>
  </div>

  <script>
    function togglePasswordVisibility(icon) {
      const input = icon.previousElementSibling;
      if (input.type === "password") {
        input.type = "text";
        icon.innerText = "🙈";
      } else {
        input.type = "password";
        icon.innerText = "👁️";
      }
    }

    function showStatus(message, isError) {
      const box = document.getElementById("statusBox");
      box.innerHTML = `<div class="status-msg ${isError ? 'status-error' : 'status-success'}">${message}</div>`;
    }

    async function handleOfficerReset() {
      const officer_id = document.getElementById("officerIdInput").value.trim().toUpperCase();
      const dob = document.getElementById("dobInput").value.trim();
      const new_password = document.getElementById("newPasswordInput").value;

      if (!officer_id || !dob || !new_password) {
        showStatus("All fields are required.", true);
        return;
      }

      const btn = document.getElementById("btnSubmitReset");
      btn.disabled = true;
      btn.innerText = "Authenticating Officer Record...";

      try {
        const res = await fetch("/api/admin/forgot-password/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ officer_id, dob, new_password })
        });
        const data = await res.json();

        if (data.success) {
          showStatus(data.message, false);
          setTimeout(() => {
            window.location.href = "/admin/login";
          }, 1500);
        } else {
          showStatus(data.message || "Failed to reset access key.", true);
          btn.disabled = false;
          btn.innerText = "Reset Access Key";
        }
      } catch (err) {
        console.error(err);
        showStatus("Network error resetting password.", true);
        btn.disabled = false;
        btn.innerText = "Reset Access Key";
      }
    }
  </script>
</body>
</html>
