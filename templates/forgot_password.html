<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicLens - Reset Password</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-700: #334155;
      --slate-400: #94a3b8;
      --box-border: rgba(255, 255, 255, 0.09);
      --cyan: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      min-height: 100vh;
      background-color: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }

    .card {
      max-width: 420px;
      width: 100%;
      background: var(--slate-900);
      border: 1px solid var(--box-border);
      border-radius: 16px;
      padding: 34px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .title { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: var(--slate-400); line-height: 1.5; margin-bottom: 20px; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    
    input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn-submit:hover { background: var(--primary-dark); }
    .btn-submit:disabled { background: #334155; cursor: not-allowed; }

    .status-msg { font-size: 13px; margin-bottom: 16px; padding: 10px; border-radius: 8px; }
    .status-success { background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; }
    .status-error { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; }
    
    .back-link { display: block; text-align: center; margin-top: 18px; font-size: 13px; color: var(--slate-400); text-decoration: none; }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>

  <div class="card">
    <h2 class="title">Reset Password</h2>
    <p class="subtitle">Verify your identity using your registered Phone Number and Date of Birth.</p>

    <div id="statusBox"></div>

    <form id="resetForm" onsubmit="event.preventDefault(); handlePasswordReset();">
      <div class="form-group">
        <label>Registered Phone Number</label>
        <input type="tel" id="phoneInput" placeholder="e.g. 9876543210" required>
      </div>

      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" id="dobInput" required style="color-scheme: dark;">
      </div>

      <div class="form-group">
        <label>New Password</label>
        <div style="position: relative;">
          <input type="password" id="newPasswordInput" placeholder="Minimum 6 characters" required style="padding-right: 44px;">
          <span onclick="togglePasswordVisibility(this)" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 16px; user-select: none;">👁️</span>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmitReset">Reset Password</button>
    </form>

    <a href="/login" class="back-link">Back to Sign In</a>
  </div>

  <script>
    function togglePasswordVisibility(icon) {
      const input = icon.previousElementSibling;
      if (input.type === "password") {
        input.type = "text";
        icon.innerText = "🙈";
      } else {
        input.type = "password";
        icon.innerText = "👁️";
      }
    }

    function showStatus(message, isError) {
      const box = document.getElementById("statusBox");
      box.innerHTML = `<div class="status-msg ${isError ? 'status-error' : 'status-success'}">${message}</div>`;
    }

    async function handlePasswordReset() {
      const phone = document.getElementById("phoneInput").value.trim();
      const dob = document.getElementById("dobInput").value.trim();
      const newPassword = document.getElementById("newPasswordInput").value;

      if (!phone || !dob || !newPassword) {
        showStatus("Please fill in all fields.", true);
        return;
      }

      const btn = document.getElementById("btnSubmitReset");
      btn.disabled = true;
      btn.innerText = "Verifying & Resetting...";

      try {
        const res = await fetch("/api/forgot-password/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, dob, new_password: newPassword })
        });
        const data = await res.json();

        if (data.success) {
          showStatus(data.message, false);
          setTimeout(() => {
            window.location.href = "/login";
          }, 1500);
        } else {
          showStatus(data.message || "Failed to reset password.", true);
          btn.disabled = false;
          btn.innerText = "Reset Password";
        }
      } catch (err) {
        console.error(err);
        showStatus("Network error resetting password.", true);
        btn.disabled = false;
        btn.innerText = "Reset Password";
      }
    }
  </script>
</body>
</html>
