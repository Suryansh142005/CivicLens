<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicLens - Super Admin Access</title>
  <style>
    :root {
      --primary: #7c3aed;
      --primary-dark: #6d28d9;
      --slate-900: #0b1120;
      --slate-800: #0f172a;
      --slate-400: #94a3b8;
      --box-border: rgba(255, 255, 255, 0.09);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      min-height: 100vh;
      background-color: var(--slate-900);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }
    .login-container {
      max-width: 420px;
      width: 100%;
      background: var(--slate-800);
      border: 1px solid var(--box-border);
      border-radius: 16px;
      padding: 34px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .portal-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124, 58, 237, 0.15);
      border: 1px solid rgba(124, 58, 237, 0.3);
      color: #a78bfa;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 14px;
    }
    .login-title { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .login-subtitle { font-size: 13px; color: var(--slate-400); line-height: 1.4; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.25); }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4);
    }
    .btn-submit:hover { background: var(--primary-dark); }
    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="portal-tag"><span>🔐</span> Super Admin Access</div>
    <h2 class="login-title">Officer Provisioning</h2>
    <p class="login-subtitle">Restricted access. Used only to create and manage municipal officer accounts.</p>

    {% if error %}
      <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/superadmin/login">
      <div class="form-group">
        <label>Super Admin ID</label>
        <input type="text" name="admin_id" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn-submit">Sign In</button>
    </form>
  </div>
</body>
</html>
